
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SATYAM NISHAD MASTER BRAIN</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eaf3ff;
  text-align: center;
  padding: 15px;
}
.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 3px 12px #aaa;
}
h1 { color: #0756b5; }
select, input, button {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border-radius: 9px;
  border: 1px solid #aaa;
  font-size: 17px;
  box-sizing: border-box;
}
button {
  background: #0756b5;
  color: white;
  border: none;
  font-weight: bold;
}
#question {
  font-size: 27px;
  font-weight: bold;
  margin: 25px 0;
}
#result, #solution {
  padding: 10px;
  font-size: 18px;
}
</style>
</head>

<body>
<div class="container">

<h1>SATYAM NISHAD</h1>
<h2>🧠 MASTER BRAIN 2.0</h2>
<p>खेलो भी और सीखो भी!</p>

<label>अपनी कक्षा चुनें</label>
<select id="classSelect"></select>

<label>अध्याय चुनें</label>
<select id="chapterSelect"></select>

<div id="question">सवाल लोड हो रहा है...</div>

<input id="answer" type="number" placeholder="अपना जवाब लिखें">

<button onclick="checkAnswer()">जवाब जाँचें</button>
<button onclick="showSolution()">हल देखें</button>
<button onclick="nextQuestion()">अगला सवाल</button>

<h3>⭐ अंक: <span id="score">0</span></h3>
<p id="result"></p>
<p id="solution"></p>

</div>

<script>
const chapters = {
  1: ["जोड़", "घटाव"],
  2: ["जोड़ और घटाव", "गुणा"],
  3: ["गुणा", "भाग"],
  4: ["बड़ी संख्याएँ", "गुणा और भाग"],
  5: ["भिन्न", "दशमलव"],
  6: ["पूर्णांक", "भिन्न"],
  7: ["परिमेय संख्याएँ", "बीजगणित"],
  8: ["रैखिक समीकरण", "वर्ग और वर्गमूल"],
  9: ["बहुपद", "रेखीय समीकरण"],
  10: ["द्विघात समीकरण", "त्रिकोणमिति"],
  11: ["समुच्चय", "फलन"],
  12: ["अवकलन", "समाकलन"]
};

const questions = {
  "1-0": [
    {q:"2 + 3 = ?", a:5, s:"2 + 3 = 5"},
    {q:"4 + 5 = ?", a:9, s:"4 + 5 = 9"}
  ],
  "1-1": [
    {q:"8 - 3 = ?", a:5, s:"8 - 3 = 5"},
    {q:"9 - 4 = ?", a:5, s:"9 - 4 = 5"}
  ],
  "2-0": [
    {q:"15 + 12 = ?", a:27, s:"15 + 12 = 27"},
    {q:"30 - 14 = ?", a:16, s:"30 - 14 = 16"}
  ],
  "2-1": [
    {q:"6 × 4 = ?", a:24, s:"6 × 4 = 24"},
    {q:"5 × 7 = ?", a:35, s:"5 × 7 = 35"}
  ],
  "3-0": [
    {q:"12 × 3 = ?", a:36, s:"12 × 3 = 36"},
    {q:"15 × 4 = ?", a:60, s:"15 × 4 = 60"}
  ],
  "3-1": [
    {q:"20 ÷ 4 = ?", a:5, s:"20 ÷ 4 = 5"}
  ],
  "4-0": [
    {q:"125 + 275 = ?", a:400, s:"125 + 275 = 400"}
  ],
  "4-1": [
    {q:"12 × 12 = ?", a:144, s:"12 × 12 = 144"}
  ],
  "5-0": [
    {q:"1/2 + 1/2 = ?", a:1, s:"1/2 + 1/2 = 1"}
  ],
  "5-1": [
    {q:"0.5 + 0.5 = ?", a:1, s:"0.5 + 0.5 = 1"}
  ],
  "6-0": [
    {q:"-5 + 8 = ?", a:3, s:"-5 + 8 = 3"}
  ],
  "6-1": [
    {q:"1/2 + 1/2 = ?", a:1, s:"1/2 + 1/2 = 1"}
  ],
  "7-0": [
    {q:"-3 + 7 = ?", a:4, s:"-3 + 7 = 4"}
  ],
  "7-1": [
    {q:"यदि x = 4, तो 2x = ?", a:8, s:"2 × 4 = 8"}
  ],
  "8-0": [
    {q:"x + 5 = 12, x = ?", a:7, s:"12 - 5 = 7"}
  ],
  "8-1": [
    {q:"15² = ?", a:225, s:"15 × 15 = 225"}
  ],
  "9-0": [
    {q:"2x + 4 = 10, x = ?", a:3, s:"2x = 10 - 4 = 6, इसलिए x = 3"}
  ],
  "9-1": [
    {q:"5x = 25, x = ?", a:5, s:"25 ÷ 5 = 5"}
  ],
  "10-0": [
    {q:"x² - 9 = 0 के लिए धनात्मक x = ?", a:3, s:"x² = 9, इसलिए धनात्मक x = 3"}
  ],
  "10-1": [
    {q:"sin 30° का मान × 2 = ?", a:1, s:"sin 30° = 1/2, इसलिए उत्तर 1"}
  ],
  "11-0": [
    {q:"यदि A = {1,2,3}, तो A में कितने तत्व हैं?", a:3, s:"A में 1, 2, 3 कुल 3 तत्व हैं"}
  ],
  "11-1": [
    {q:"f(x) = x + 2, तो f(3) = ?", a:5, s:"3 + 2 = 5"}
  ],
  "12-0": [
    {q:"x² का अवकलज, x = 3 पर कितना है?", a:6, s:"2x = 2 × 3 = 6"}
  ],
  "12-1": [
    {q:"2x का समाकलन, x = 2 पर कितना है? (C = 0)", a:4, s:"∫2x dx = x²; 2² = 4"}
  ]
};

let currentQuestion;
let score = 0;
let questionIndex = 0;

const classSelect = document.getElementById("classSelect");
const chapterSelect = document.getElementById("chapterSelect");

for (let i = 1; i <= 12; i++) {
  classSelect.innerHTML +=
    `<option value="${i}">कक्षा ${i}</option>`;
}

function loadChapters() {
  const c = classSelect.value;
  chapterSelect.innerHTML = "";

  chapters[c].forEach((name, index) => {
    chapterSelect.innerHTML +=
      `<option value="${index}">${name}</option>`;
  });

  questionIndex = 0;
  nextQuestion();
}

function nextQuestion() {
  const key = classSelect.value + "-" + chapterSelect.value;
  const list = questions[key] || [];

  if (list.length === 0) {
    document.getElementById("question").innerText =
      "इस अध्याय के सवाल जल्द जोड़े जाएँगे।";
    currentQuestion = null;
    return;
  }

  currentQuestion = list[questionIndex % list.length];
  questionIndex++;

  document.getElementById("question").innerText =
    currentQuestion.q;
  document.getElementById("answer").value = "";
  document.getElementById("result").innerText = "";
  document.getElementById("solution").innerText = "";
}

function checkAnswer() {
  if (!currentQuestion) return;

  const value = document.getElementById("answer").value;
  if (value.trim() === "") {
    document.getElementById("result").innerText =
      "पहले अपना जवाब लिखो।";
    return;
  }

  if (Number(value) === currentQuestion.a) {
    score += 10;
    document.getElementById("result").innerText =
      "🎉 सही जवाब! 10 अंक मिले।";
  } else {
    document.getElementById("result").innerText =
      "❌ जवाब गलत है। फिर कोशिश करो।";
  }

  document.getElementById("score").innerText = score;
}

function showSolution() {
  if (!currentQuestion) return;
  document.getElementById("solution").innerText =
    "हल: " + currentQuestion.s;
}

classSelect.addEventListener("change", loadChapters);
chapterSelect.addEventListener("change", () => {
  questionIndex = 0;
  nextQuestion();
});

loadChapters();
</script>
</body>
  </html>
