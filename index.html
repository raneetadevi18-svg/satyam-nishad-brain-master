<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SATYAM NISHAD MASTER BRAIN</title>
<style>
body{font-family:Arial;background:#eef4ff;text-align:center;padding:20px}
.box{background:white;padding:22px;border-radius:16px;max-width:420px;margin:auto}
select,input,button{font-size:18px;padding:12px;margin:8px;width:90%;border-radius:9px}
button{background:#1455cc;color:white;border:0}
#question{font-size:28px;font-weight:bold;margin:25px}
#result{font-size:20px}
</style>
</head>
<body>
<div class="box">
<h1>SATYAM NISHAD</h1>
<h2>🧠 MASTER BRAIN</h2>
<select id="classSelect">
<option value="1">Class 1</option><option value="2">Class 2</option>
<option value="3">Class 3</option><option value="4">Class 4</option>
<option value="5">Class 5</option><option value="6">Class 6</option>
<option value="7">Class 7</option><option value="8">Class 8</option>
<option value="9">Class 9</option><option value="10">Class 10</option>
<option value="11">Class 11</option><option value="12">Class 12</option>
</select>
<div id="question">2 + 3 = ?</div>
<input id="answer" type="number" placeholder="अपना जवाब लिखें">
<button onclick="checkAnswer()">जवाब जाँचें</button>
<button onclick="nextQuestion()">अगला सवाल</button>
<p id="result">स्कोर: 0</p>
</div>
<script>
let score=0;
let current=0;
const questions={
1:[["2 + 3",5],["4 + 5",9],["8 - 3",5]],
2:[["12 + 8",20],["25 - 10",15],["5 × 3",15]],
3:[["25 + 35",60],["80 - 27",53],["6 × 7",42]],
4:[["125 + 75",200],["144 ÷ 12",12],["15 × 6",90]],
5:[["250 + 350",600],["12 × 12",144],["1000 - 425",575]],
6:[["25 × 12",300],["144 ÷ 9",16],["3/4 + 1/4",1]],
7:[["15 × 8",120],["-5 + 12",7],["25% of 200",50]],
8:[["12²",144],["√169",13],["3x = 21, x = ?",7]],
9:[["2x + 5 = 15, x = ?",5],["12² - 10²",44],["√225",15]],
10:[["15% of 400",60],["2³ × 3",24],["√400",20]],
11:[["2 + 3 × 4",14],["5² + 12",37],["√625",25]],
12:[["3² + 4²",25],["2⁴ × 2",32],["√900",30]]
};
function showQuestion(){
let list=questions[document.getElementById("classSelect").value];
current=current%list.length;
document.getElementById("question").textContent=list[current][0]+" = ?";
document.getElementById("answer").value="";
document.getElementById("result").textContent="स्कोर: "+score;
}
function checkAnswer(){
let list=questions[document.getElementById("classSelect").value];
let val=document.getElementById("answer").value;
if(val===""){document.getElementById("result").textContent="पहले जवाब लिखो";return;}
if(Number(val)===list[current][1]){
score+=10;
document.getElementById("result").textContent="सही जवाब! 🎉 स्कोर: "+score;
}else{
document.getElementById("result").textContent="फिर कोशिश करो। स्कोर: "+score;
}
}
function nextQuestion(){current++;showQuestion();}
document.getElementById("classSelect").addEventListener("change",()=>{
current=0;showQuestion();
});
showQuestion();
</script>
</body>
</html>
